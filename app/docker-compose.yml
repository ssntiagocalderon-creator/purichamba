# Solo Postgres con pgvector. QVAC NO va en Docker: en Mac, Docker no usa la GPU de Apple
# (Plan, sección 10.2). La API corre directo con Node y carga @qvac/sdk en su propio proceso.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: pasaporte
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pasaporte"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
